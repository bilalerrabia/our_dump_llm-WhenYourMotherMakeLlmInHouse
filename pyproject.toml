[project]
name = "our-llm"
version = "0.2.0"
description = "A GPT built from scratch: corpus -> BPE -> GPT -> training -> sampling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "numpy>=2.5.4",
    "regex>=2026.7.19",
    "torch>=2.14.1",
    "tqdm>=4.70.0",
]

[project.scripts]
our-llm = "our_llm:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `from src.tokenizer import ...` (reference implementation) works,
# "src" so `from our_llm... import ...` works even without the editable install.
pythonpath = [".", "src"]
